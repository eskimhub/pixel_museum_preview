<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김동구전 - PIXEL MUSEUM</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <canvas id="game" aria-label="픽셀 미술관 3D 화면"></canvas>
  <div id="hud">
    <span class="hud-title">김동구전</span>
    <span id="hud-status">로딩 중...</span>
  </div>
  <div id="auth-bar" hidden>
    <button id="gb-open" type="button">방명록</button>
    <span id="auth-who" hidden></span>
    <button id="auth-open" type="button">로그인</button>
    <button id="auth-logout" type="button" hidden>로그아웃</button>
  </div>
  <section id="gb-modal" hidden role="dialog" aria-modal="true" aria-labelledby="gb-title">
    <h2 id="gb-title">방명록</h2>
    <p id="gb-note"></p>
    <ul id="gb-list"></ul>
    <form id="gb-form" novalidate>
      <label>이름 <input id="gb-name" type="text" maxlength="20" autocomplete="nickname"></label>
      <label>한 줄 남기기 <textarea id="gb-message" rows="2" maxlength="200"></textarea></label>
      <div class="auth-buttons"><button id="gb-submit" type="submit">남기기</button></div>
    </form>
    <p id="gb-status" role="status"></p>
    <div class="auth-buttons">
      <button id="gb-enter" type="button" hidden>게스트로 입장</button>
      <button id="gb-close" type="button">닫기</button>
    </div>
  </section>
  <section id="auth-modal" hidden role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <form id="auth-form" novalidate>
      <h2 id="auth-title">로그인 / 가입</h2>
      <label>이메일 <input id="auth-email" type="email" autocomplete="email"></label>
      <label>비밀번호 (6자 이상) <input id="auth-password" type="password" autocomplete="current-password"></label>
      <p id="auth-msg" role="status"></p>
      <div class="auth-buttons">
        <button type="submit">로그인</button>
        <button id="auth-signup" type="button">가입</button>
        <button id="auth-cancel" type="button">닫기</button>
      </div>
    </form>
  </section>
  <div id="prompt" hidden></div>
  <div id="touch" hidden>
    <div id="stick-base" aria-label="이동 조이스틱"><div id="stick-knob"></div></div>
    <button id="touch-act" type="button">보기</button>
  </div>
  <section id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panel-title">
    <img id="panel-image" alt="" hidden>
    <h2 id="panel-title"></h2>
    <p id="panel-author"></p>
    <p id="panel-desc"></p>
    <button id="upload-open" type="button" hidden>작품 올리기</button>
    <div class="upload-owner">
      <button id="upload-replace" type="button" hidden>작품 바꾸기</button>
      <button id="upload-remove" type="button" hidden>내리기</button>
    </div>
    <p id="upload-msg" role="status"></p>
    <form id="upload-form" hidden novalidate>
      <label>이미지 (png, jpg, webp) <input id="upload-file" type="file" accept="image/png,image/jpeg,image/webp"></label>
      <label>제목 <input id="upload-title" type="text" maxlength="60"></label>
      <label>설명 <textarea id="upload-desc" rows="3" maxlength="500"></textarea></label>
      <div class="auth-buttons">
        <button id="upload-submit" type="submit">올리기</button>
        <button id="upload-cancel" type="button">취소</button>
      </div>
    </form>
    <div class="panel-foot">
      <p class="panel-close">E / Space / Esc 로 닫기</p>
      <button id="panel-close-btn" type="button">닫기</button>
    </div>
  </section>
  <script>
    // main.js(ES 모듈)가 실행되지 못했을 때 화면에 원인을 알려준다.
    (function () {
      var s = document.getElementById('hud-status');
      if (location.protocol === 'file:') {
        s.textContent = 'index.html을 직접 열면 동작하지 않습니다. 터미널에서 "python3 -m http.server 8000" 실행 후 http://localhost:8000 으로 접속하세요.';
        s.className = 'hud-error';
        return;
      }
      setTimeout(function () {
        if (s.textContent === '로딩 중...') {
          s.textContent = '불러오지 못했습니다. 브라우저 콘솔(F12)의 오류를 확인하세요.';
          s.className = 'hud-error';
        }
      }, 3000);
    })();
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
